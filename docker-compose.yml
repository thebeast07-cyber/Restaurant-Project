services:
  postgres:
    image: postgres:16-alpine
    container_name: restaurant-postgres
    environment:
      POSTGRES_USER: restaurant
      POSTGRES_PASSWORD: restaurant_dev_only
      POSTGRES_DB: restaurant_db
    ports:
      - "5432:5432"
    volumes:
      - restaurant_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U restaurant"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  restaurant_pg_data:
